name: Build rodriguezlawncareios IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS App (IPA)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode Version
        run: |
          xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          cd RodriguezLawnCareIosAPP
          xcodebuild \
            -project RodriguezLawnCare.xcodeproj \
            -scheme rodriguezlawncareios \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Package unsigned IPA
        run: |
          cd RodriguezLawnCareIosAPP
          mkdir -p package/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/*.app package/Payload/
          cd package
          /usr/bin/zip -qry ../rodriguezlawncareios-unsigned.ipa Payload
          cd ..

      - name: Copy IPA to distribution folders
        run: |
          BUILD_NUM=$(python3 -c "import json; print(json.load(open('cloud_config.json')).get('app_build', 37))")
          VER_NUM=$(python3 -c "import json; print(json.load(open('cloud_config.json')).get('app_version', '2.7.0'))")
          echo "Building distribution for Version $VER_NUM Build $BUILD_NUM"
          
          rm -rf "ultima actu" "RodriguezLawnCareIosAPP/ultima actu" "ipa online" "RodriguezLawnCareIosAPP/ipa online" "ipa here" "RodriguezLawnCareIosAPP/ipa here" "ipa nuevo" "RodriguezLawnCareIosAPP/ipa nuevo"
          mkdir -p "ultima actu"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "ultima actu/RodriguezLawnCare_v${VER_NUM}_Build${BUILD_NUM}.ipa"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "ultima actu/rodriguezlawncareios.ipa"
          echo "ESTA ES LA ÚLTIMA VERSIÓN COMPILADA: RodriguezLawnCare_v${VER_NUM}_Build${BUILD_NUM}.ipa (Build ${BUILD_NUM})" > "ultima actu/LEEME_CUAL_INSTALAR.txt"
          
          mkdir -p "RodriguezLawnCareIosAPP/ultima actu"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "RodriguezLawnCareIosAPP/ultima actu/RodriguezLawnCare_v${VER_NUM}_Build${BUILD_NUM}.ipa"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "RodriguezLawnCareIosAPP/ultima actu/rodriguezlawncareios.ipa"
          
          mkdir -p "ipa online"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "ipa online/RodriguezLawnCare_v${VER_NUM}_Build${BUILD_NUM}.ipa"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "ipa online/rodriguezlawncareios.ipa"
          
          mkdir -p "RodriguezLawnCareIosAPP/ipa online"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "RodriguezLawnCareIosAPP/ipa online/RodriguezLawnCare_v${VER_NUM}_Build${BUILD_NUM}.ipa"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "RodriguezLawnCareIosAPP/ipa online/rodriguezlawncareios.ipa"
          
          mkdir -p "ipa here"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "ipa here/RodriguezLawnCare_v${VER_NUM}_Build${BUILD_NUM}.ipa"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "ipa here/rodriguezlawncareios.ipa"
          
          mkdir -p "RodriguezLawnCareIosAPP/ipa here"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "RodriguezLawnCareIosAPP/ipa here/RodriguezLawnCare_v${VER_NUM}_Build${BUILD_NUM}.ipa"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "RodriguezLawnCareIosAPP/ipa here/rodriguezlawncareios.ipa"
          
          mkdir -p "ipa nuevo"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "ipa nuevo/RodriguezLawnCare_v${VER_NUM}_Build${BUILD_NUM}.ipa"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "ipa nuevo/rodriguezlawncareios.ipa"
          
          mkdir -p "RodriguezLawnCareIosAPP/ipa nuevo"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "RodriguezLawnCareIosAPP/ipa nuevo/RodriguezLawnCare_v${VER_NUM}_Build${BUILD_NUM}.ipa"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "RodriguezLawnCareIosAPP/ipa nuevo/rodriguezlawncareios.ipa"
          
          ls -la "ultima actu"
          ls -la "ipa online"

      - name: Commit and push IPA to repository
        run: |
          BUILD_NUM=$(python3 -c "import json; print(json.load(open('cloud_config.json')).get('app_build', 37))")
          VER_NUM=$(python3 -c "import json; print(json.load(open('cloud_config.json')).get('app_version', '2.7.0'))")
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "ultima actu/" "RodriguezLawnCareIosAPP/ultima actu/" "ipa online/" "RodriguezLawnCareIosAPP/ipa online/" "ipa here/" "RodriguezLawnCareIosAPP/ipa here/" "ipa nuevo/" "RodriguezLawnCareIosAPP/ipa nuevo/"
          git commit -m "Automated build: Update IPAs in 'ultima actu' and 'ipa online' (v${VER_NUM} Build ${BUILD_NUM}) [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rodriguezlawncareios-IPA
          path: |
            ultima actu/rodriguezlawncareios.ipa
            ultima actu/RodriguezLawnCare_v2.7.0_Build35.ipa
            ipa online/rodriguezlawncareios.ipa
            ipa here/rodriguezlawncareios.ipa
            RodriguezLawnCareIosAPP/build.log
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-ipa
          name: "rodriguezlawncareios App (Latest IPA)"
          body: "Descarga directa de rodriguezlawncareios.ipa (v2.7.0 Build 35) compilada automáticamente por GitHub Actions."
          files: |
            ultima actu/rodriguezlawncareios.ipa
            ultima actu/RodriguezLawnCare_v2.7.0_Build35.ipa
            ipa online/rodriguezlawncareios.ipa
            ipa here/rodriguezlawncareios.ipa

      - name: Send IPA directly to Discord Channel (#ipalwan)
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          IPA_CHANNEL_ID: "1565299006932914176"
        run: |
          python3 -m pip install --break-system-packages discord.py python-dotenv aiohttp || python3 -m pip install discord.py python-dotenv aiohttp || true
          python3 send_ipa_discord.py || true
          curl -s -X POST https://rodriguezlawncare.xyz/api/ipa/send-discord || true
