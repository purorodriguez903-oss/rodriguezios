name: Build rodriguezlawncareios IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS App (IPA)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode Version
        run: |
          xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          cd RodriguezLawnCareIosAPP
          xcodebuild \
            -project RodriguezLawnCare.xcodeproj \
            -scheme rodriguezlawncareios \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Package unsigned IPA
        run: |
          cd RodriguezLawnCareIosAPP
          mkdir -p package/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/*.app package/Payload/
          cd package
          /usr/bin/zip -qry ../rodriguezlawncareios-unsigned.ipa Payload
          cd ..

      - name: Copy IPA to 'ipa online' folder
        run: |
          mkdir -p "ipa online"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "ipa online/rodriguezlawncareios.ipa"
          mkdir -p "RodriguezLawnCareIosAPP/ipa online"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "RodriguezLawnCareIosAPP/ipa online/rodriguezlawncareios.ipa"
          mkdir -p "ipa here"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "ipa here/rodriguezlawncareios.ipa"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "ipa here/RodriguezLawnCare.ipa"
          mkdir -p "RodriguezLawnCareIosAPP/ipa here"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "RodriguezLawnCareIosAPP/ipa here/rodriguezlawncareios.ipa"
          cp RodriguezLawnCareIosAPP/rodriguezlawncareios-unsigned.ipa "RodriguezLawnCareIosAPP/ipa here/RodriguezLawnCare.ipa"
          ls -la "ipa online"

      - name: Commit and push IPA to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "ipa online/" "RodriguezLawnCareIosAPP/ipa online/" "ipa here/" "RodriguezLawnCareIosAPP/ipa here/"
          git commit -m "Automated build: Update rodriguezlawncareios.ipa in 'ipa online' [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rodriguezlawncareios-IPA
          path: |
            ipa online/rodriguezlawncareios.ipa
            ipa here/rodriguezlawncareios.ipa
            RodriguezLawnCareIosAPP/build.log
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-ipa
          name: "rodriguezlawncareios App (Latest IPA)"
          body: "Descarga directa de rodriguezlawncareios.ipa compilada automáticamente por GitHub Actions."
          files: |
            ipa online/rodriguezlawncareios.ipa
            ipa here/rodriguezlawncareios.ipa
            ipa here/RodriguezLawnCare.ipa

      - name: Send IPA directly to Discord Channel (#ipalwan)
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          IPA_CHANNEL_ID: "1565299006932914176"
        run: |
          python3 -m pip install discord.py python-dotenv aiohttp || true
          python3 send_ipa_discord.py || true
          curl -s -X POST https://web-production-b6891b.up.railway.app/api/ipa/send-discord || true
